name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
    services:
      postgres:
        image: ${{ vars.POSTGRES_IMAGE }}
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_CONTAINER_PORT: ${{ vars.POSTGRES_CONTAINER_PORT }}
        ports:
          - ${{ vars.POSTGRES_PORT }}:${{ vars.POSTGRES_CONTAINER_PORT }}
        options: >-
          --health-cmd "pg_isready -p $POSTGRES_CONTAINER_PORT -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval ${{ vars.POSTGRES_HEALTHCHECK_INTERVAL }}
          --health-timeout ${{ vars.POSTGRES_HEALTHCHECK_TIMEOUT }}
          --health-retries ${{ vars.POSTGRES_HEALTHCHECK_RETRIES }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.CI_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest tests.test_pipeline

      - name: Run PostgreSQL integration tests
        run: python -m unittest tests.postgres_integration